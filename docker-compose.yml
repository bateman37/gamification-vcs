services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gamification_vcs
    ports:
      - "5432:5432"
    volumes:
      - gamification_vcs_db_data:/var/lib/postgresql/data

volumes:
  gamification_vcs_db_data:
